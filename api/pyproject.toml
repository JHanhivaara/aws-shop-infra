[project]
name = "shop"
version = "0.1.0"
description = "Shop API: FastAPI on AWS Lambda with RDS Postgres"
authors = [
    { name = "Juuso Hanhivaara", email = "77466940+JHanhivaara@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "mangum>=0.22.0",
    "psycopg[binary]>=3.3.6",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi[standard]>=0.143.0",
]
