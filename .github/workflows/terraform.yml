name: terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  id-token: write # lets the job request a GitHub OIDC token
  contents: read

concurrency: terraform # never two runs touching state at once

env:
  AWS_REGION: eu-north-1
  ACCOUNT: "070443470685"

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra } }
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT }}:role/gha-plan
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform fmt -check -recursive ..
      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform plan -input=false -out=tfplan
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with: { name: tfplan, path: infra/tfplan }

  apply:
    if: github.event_name == 'push'
    needs: plan
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra } }
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT }}:role/gha-apply
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/download-artifact@v4
        with: { name: tfplan, path: infra }
      - run: terraform init -input=false
      - run: terraform apply -input=false tfplan # applies exactly what was planned
